    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --accent: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.4);
            --border-color: #222222;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --font-sans: 'Inter', sans-serif;
            --success-green: #00ff88;
            --error-red: #ff3333;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        
        h1, h2, h3, h4, .tech-tag, .status-label, .cta-button, .link-button, .footer, .prompt, 
        #authForm label, #authForm button, .data-section h3, .info-item label { font-family: var(--font-mono); }
        
        h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; }
        h2 { font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        h3 { font-size: 1.3rem; margin-bottom: 1rem; color: var(--accent); }
        h4 { font-size: 1.1rem; margin: 1.5rem 0 0.8rem 0; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        
        .accent { color: var(--accent); }
        .success { color: var(--success-green); }
        .error { color: var(--error-red); }
        
        .hero { text-align: center; padding: 4rem 1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 3rem; }
        .tagline { font-size: 1.2rem; color: var(--text-secondary); max-width: 700px; margin: 0 auto 2rem; }
        
        #authForm { max-width: 500px; margin: 2rem auto; padding: 2rem; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 4px; }
        #authForm label { display: block; margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--text-secondary); }
        #passwordInput {
            width: 100%; padding: 1rem; background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);
            font-family: var(--font-mono); font-size: 1.1rem; letter-spacing: 1px;
            margin-bottom: 1.5rem; transition: border-color 0.3s ease;
        }
        #passwordInput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        #authForm button {
            width: 100%; padding: 1rem; background-color: transparent; color: var(--accent);
            border: 1px solid var(--accent); font-size: 1.1rem; cursor: pointer; border-radius: 4px;
            transition: all 0.3s ease; box-shadow: 0 0 10px var(--accent-glow);
        }
        #authForm button:hover { background-color: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent-glow); }
        #authMessage { text-align: center; margin-top: 1rem; min-height: 1.5rem; font-family: var(--font-mono); }
        
        #dataDisplay { display: none; margin-top: 2rem; }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; margin-top: 1.5rem; }
        .data-section {
            background-color: var(--bg-secondary); border: 1px solid var(--border-color); padding: 1.5rem;
            border-radius: 4px; transition: border-color 0.3s ease;
        }
        .data-section:hover { border-color: rgba(255, 0, 60, 0.5); }
        .info-item { margin-bottom: 1.2rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .info-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .info-item label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item .value { font-size: 1.1rem; color: var(--text-primary); word-break: break-word; }
        .list-item { margin-bottom: 0.5rem; }
        .badge {
            display: inline-block; background-color: rgba(0, 255, 136, 0.1); color: var(--success-green);
            padding: 0.3rem 0.7rem; border-radius: 3px; font-size: 0.85rem;
            border: 1px solid rgba(0, 255, 136, 0.3); font-family: var(--font-mono);
        }
        
        #logoutBtn {
            display: none; margin: 2rem auto; padding: 0.8rem 2rem; background-color: transparent;
            color: var(--text-secondary); border: 1px solid var(--border-color); font-family: var(--font-mono);
            font-size: 0.9rem; cursor: pointer; border-radius: 4px; transition: all 0.3s ease;
        }
        #logoutBtn:hover { border-color: var(--accent); color: var(--accent); }
        
        .footer { text-align: center; padding-top: 3rem; border-top: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.9rem; margin-top: 3rem; }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; } h2 { font-size: 1.5rem; }
            .container { padding: 1.5rem 1rem; } .hero { padding: 3rem 0.5rem; }
            #authForm { padding: 1.5rem; } .data-grid { grid-template-columns: 1fr; }
        }
    </style>

<body>
    <div class="container">

            <h2>[ Secure Identity Vault ]</h2>
            <p class="tagline">Personal information encrypted client-side. Data exists only in memory after successful authentication.</p>
            
            <form id="authForm">
                <label for="passwordInput"><span class="accent">></span> Enter PSK to decrypt:</label>
                <input type="password" id="passwordInput" placeholder="················" autocomplete="off" autofocus>
                <button type="submit"><span class="accent">></span> Decrypt & Load</button>
                <div id="authMessage"></div>

        <div id="dataDisplay">
            <h2><span class="accent">#</span> decrypted_identity</h2>

            <button id="logoutBtn"><span class="accent">></span> Clear Session & Lock</button>

        <footer class="footer">
            <p>© <span id="current-year">2024</span> | <span class="accent">Client-Side Encryption</span> | No data persistence</p>
            <p class="footer-hint"><span class="accent">$</span> Data exists only in active memory. Close tab to erase.</p>
        </footer>
    </div>

    <script>
        const encryptedDataBlob = "3PnPHOhFO74XSRU3hZO6+44e9LL1H9b9XSrcIskWEgxKe7iZEeRY3C9lThqBjPtf9Y3W+rUQ5orPNfVl4X3ovAQVcABFsBT8dLKmcPad0FmM9p3NAiaxbkiYP3u//a0f09LJ1C7cMJs9bs2LPSA1XKKlAN4jBPw4vHheJzPXES0qvIiM9OqsFhgO5lbptO8Wxp3IJZoqjXOEgoKYnshMmTE7AjHtSfV1jQCqE3Gon87Z+qIQGdYcQrnDrSk3clp5yaxaC0SnUTcl08/nyd8Y6mB4ilUMWxdbjLufGCERrSZhiXGLFbTVXrLvk2vzjCafA6Yl8vxQn/wICtiiCLxOmeHWzTgPeYlMWO1VfsiGchbY5Rz5cK6Ul2ZjX060CQabQKv10rrPHUo2mbhaKRRwaReB+g3y/cPRaefNNdX2BwqrqLOLhmry8ps6DJBwvFaFrLFDQsUX9OarJ8ZtnqU57ytqTKBCe4pbi7msSl+jOMeWGXkSMnLHyHytYJq5BWnxJST2VovtX/UO4E/Ul/BQ4tumBSk2MyiywHTdZGox3ScWVnpIR+7G+ANKW3mHD7DU+/zdLtWK7AcxERg5wKm/Szhafj+OblxPVixXmUSCfv4lhp+jO2OJbIPmwhZWwJZ8ZpbPRQ0JqSBmOi1vaPpg00ZZgtTBhNmqJMcK+MUvxN6CCqkAmEMX75gWRd5TmXPUY9H7WdkxBGjjkbmivWLag4+XUKqWHHMOWsj2IoGs9q5x97SPanKXSaJsY/FgATdWTEey9bWSjlJQ3z7BuCstx7c3RaxyPtR+Xlzikg44CKZcofBiUB/U0gYc3T4VsVU7mfSBlZNU0WbkV8P5JB4iBIX8DB9T2PxJFh+xQEwS7pfF7daoBncPU4fkR+xumE+2S6KyZjLcranibNbLInYsvRF3qHhu8gOsJin58zlCxpeqGdM6GBzpK8akscoNh5h7KtJhvorG5gzXWNxZhEn06gofUUIn1ca/IUEKZvZR9oRCgW3UfRpcRxrgMx4JJYgBj0gdZD2Rcw7aWEkxjNuv0Rnu7VhpGA/rJ0ZVnBdBYTEXb0n0XV/vRhr3yJSB2KRnHTOiI06hS19pb61r2qxRnQ==";

        document.getElementById('current-year').textContent = new Date().getFullYear();

        function capitalize(key) {
            return key
                .replace(/([A-Z])/g, ' $1')
                .replace(/^./, (s) => s.toUpperCase())
                .replace(/_/g, ' ');
        }

        function renderObject(obj, container, headerLevel = 4) {
            Object.keys(obj).forEach((key) => {
                const val = obj[key];
                if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                    const header = document.createElement(`h${headerLevel}`);
                    header.innerHTML = `<span class="accent">></span> ${capitalize(key)}`;
                    container.appendChild(header);
                    renderObject(val, container, headerLevel + 1);
                } else {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'info-item';
                    const label = document.createElement('label');
                    label.textContent = capitalize(key);
                    itemDiv.appendChild(label);
                    const valueDiv = document.createElement('div');
                    valueDiv.className = 'value';
                    if (Array.isArray(val)) {
                        val.forEach((item) => {
                            const listItem = document.createElement('div');
                            listItem.className = 'list-item';
                            listItem.textContent = item;
                            valueDiv.appendChild(listItem);
                        });
                    } else if (typeof val === 'boolean') {
                        valueDiv.textContent = val ? 'Yes' : 'No';
                    } else {
                        valueDiv.textContent = val;
                    }
                    if (key.toLowerCase() === 'bloodgroup') {
                        valueDiv.innerHTML = `<span class="badge">${valueDiv.textContent}</span>`;
                    }
                    itemDiv.appendChild(valueDiv);
                    container.appendChild(itemDiv);
                }
            });
        }

        function unpadPKCS7(text) {
            if (text.length === 0) return text;
            const pad = text.charCodeAt(text.length - 1);
            if (pad < 1 || pad > 16) return text;
            const padBytes = text.slice(text.length - pad);
            if (![...padBytes].every(c => c.charCodeAt(0) === pad)) return text;
            return text.slice(0, text.length - pad);
        }

        async function deriveKey(password, salt, iterations = 100000) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );
            
            return await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: iterations,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-CBC", length: 256 },
                false,
                ["decrypt"]
            );
        }

        async function decryptData(encryptedBase64, password) {
            try {
                const encryptedBuffer = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
                
                const salt = encryptedBuffer.slice(0, 16);
                const iv = encryptedBuffer.slice(16, 32);
                const encrypted = encryptedBuffer.slice(32);
                
                const key = await deriveKey(password, salt);
                
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: "AES-CBC", iv: iv },
                    key,
                    encrypted
                );
                
                let decryptedText = new TextDecoder().decode(decryptedBuffer);
                decryptedText = unpadPKCS7(decryptedText);
                
                return JSON.parse(decryptedText);
                
            } catch (error) {
                console.error("Decryption failed:", error);
                return null;
            }
        }

        function displayData(data) {
            if (!data) return;
            
            const dataGrid = document.querySelector('.data-grid');
            dataGrid.innerHTML = '';
            
            Object.keys(data).forEach((key) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'data-section';
                const h3 = document.createElement('h3');
                h3.innerHTML = `<span class="accent">></span> ${capitalize(key)}`;
                sectionDiv.appendChild(h3);
                
                const val = data[key];
                if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                    renderObject(val, sectionDiv);
                } else {
                    const valueDiv = document.createElement('div');
                    valueDiv.className = 'value';
                    if (Array.isArray(val)) {
                        val.forEach((item) => {
                            const listItem = document.createElement('div');
                            listItem.className = 'list-item';
                            listItem.textContent = item;
                            valueDiv.appendChild(listItem);
                        });
                    } else if (typeof val === 'boolean') {
                        valueDiv.textContent = val ? 'Yes' : 'No';
                    } else {
                        valueDiv.textContent = val;
                    }
                    sectionDiv.appendChild(valueDiv);
                }
                
                dataGrid.appendChild(sectionDiv);
            });
            
            document.getElementById('dataDisplay').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('authForm').style.display = 'none';
        }

        function clearSession() {
            document.getElementById('dataDisplay').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('authForm').style.display = 'block';
            
            document.getElementById('passwordInput').value = '';
            document.getElementById('authMessage').textContent = '';
            
            document.querySelector('.data-grid').innerHTML = '';
            
            document.getElementById('passwordInput').focus();
        }

        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('passwordInput').value;
            const messageEl = document.getElementById('authMessage');
            
            messageEl.textContent = 'Decrypting...';
            messageEl.className = '';
            
            try {
                const decryptedData = await decryptData(encryptedDataBlob, password);
                
                if (decryptedData) {
                    messageEl.textContent = '✅ Authentication successful!';
                    messageEl.className = 'success';
                    displayData(decryptedData);
                } else {
                    messageEl.textContent = '❌ Invalid password or corrupted data';
                    messageEl.className = 'error';
                }
            } catch (error) {
                messageEl.textContent = '❌ Decryption failed';
                messageEl.className = 'error';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', clearSession);

        window.addEventListener('beforeunload', function() {});
    </script>
</body>
